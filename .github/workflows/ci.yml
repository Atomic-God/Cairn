name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: "Python ${{ matrix.python }} · ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run full test suite
        run: python -m pytest tests/ -q

      - name: Run zero-key demo
        run: python examples/mock_agent.py

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Clean install from wheel
        run: |
          python -m pip uninstall -y cairn-core
          python -m pip install dist/*.whl

      - name: Test suite against wheel install
        # --noconftest: skip the repo-root conftest so `import cairn`
        # resolves to the installed wheel, not the source tree.
        run: python -m pytest tests/ -q -p no:cacheprovider --noconftest

      - name: CLI smoke test
        run: cairn --help

  native:
    name: "Native engine · ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust tests + clippy
        run: |
          cd rust
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Build the native extension
        run: |
          cd rust
          cargo build --release --features extension-module
          cp target/release/lib_cairn_native.so ../cairn/_cairn_native.so || cp target/release/cairn_native.dll ../cairn/_cairn_native.pyd || cp target/release/lib_cairn_native.dylib ../cairn/_cairn_native.so

      - name: Install package + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Verify native backend is active
        run: python -c "from cairn import hash; assert hash.backend() == 'native', hash.backend()"

      - name: Run full test suite against the native engine
        run: python -m pytest tests/ -q
